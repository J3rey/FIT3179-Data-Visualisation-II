        font-family: system-ui, Arial, sans-serif;

      #viz {
        width: 95%;
        max-width: 1400px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Combined Charts</h1>
    <div id="viz"></div>

    <script>
      // If combine.json is in the same folder as this HTML, keep the path as "combine.json"
      // Adjust the path if it sits elsewhere
      vegaEmbed("#viz", "../js/combine.json", { actions: true })
        .then(() => {
          /* rendered */
        })
        .catch(console.error);
    </script>
  </body>
</html>
